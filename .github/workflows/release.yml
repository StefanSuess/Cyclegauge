name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from the protected main commit
        required: true
        type: string
      dry_run:
        description: Validate the complete promotion path without writes
        required: true
        default: true
        type: boolean
      auth_mode:
        description: Open VSX authentication method for an approved live release
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - pat

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: verify candidate and remote readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      version: ${{ steps.select.outputs.version }}
      dry_run: ${{ steps.select.outputs.dry_run }}
      auth_mode: ${{ steps.select.outputs.auth_mode }}
      publisher_runtime_sha256: ${{ steps.runtime.outputs.sha256 }}
    steps:
      - name: Checkout the workflow dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'

      - name: Derive the newest trusted CI candidate from current main
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_AUTH_MODE: ${{ inputs.auth_mode }}
        run: node --disable-warning=ExperimentalWarning scripts/release/select-candidate.ts

      - name: Download the selected artifact by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/input
          merge-multiple: true

      - name: Verify the exact candidate and prepare release metadata
        id: verify
        env:
          VERSION: ${{ steps.select.outputs.version }}
          SOURCE_SHA: ${{ steps.select.outputs.source_sha }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.select.outputs.artifact_digest }}
          CANDIDATE_DIR: release/input
          BUNDLE_DIR: release/promotion-bundle
        run: node --disable-warning=ExperimentalWarning scripts/release/verify-promotion.ts

      - name: Check public version, tag, and release state without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          AUTH_MODE: ${{ steps.select.outputs.auth_mode }}
          VERSION: ${{ steps.select.outputs.version }}
          SOURCE_SHA: ${{ steps.select.outputs.source_sha }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
          PROMOTION_BUNDLE_DIR: release/promotion-bundle
        run: node --disable-warning=ExperimentalWarning scripts/release/check-readiness.ts

      - name: Install integrity-pinned pnpm and the locked Open VSX CLI outside the OIDC job
        if: ${{ inputs.dry_run == false }}
        working-directory: scripts/release/package-manager
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pnpm_bin=node_modules/pnpm/bin/pnpm.mjs
          test "$(node "$pnpm_bin" --version)" = "12.10.1"
          node "$pnpm_bin" --dir ../publisher-tools install --frozen-lockfile --ignore-scripts
          node "$pnpm_bin" --dir ../publisher-tools exec ovsx --version >/dev/null

      - name: Prepare the locked publisher runtime outside the OIDC job
        id: runtime
        if: ${{ inputs.dry_run == false }}
        run: |
          bash scripts/release/prepare-publisher-runtime.sh release/promotion-bundle scripts/release/publisher-tools/node_modules
          sha256=$(sha256sum release/promotion-bundle/publisher-runtime.tar.gz | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Store the verified promotion bundle for the protected job
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-promotion-bundle
          path: release/promotion-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-trusted:
    name: publish approved candidate with Open VSX Trusted Publishing
    if: ${{ needs.preflight.result == 'success' && inputs.dry_run == false && needs.preflight.outputs.auth_mode == 'trusted-publishing' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      url: https://open-vsx.org/extension/StefanSuess/cyclegauge
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the immutable promotion bundle from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-promotion-bundle
          path: release/promotion-bundle

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          token: ''

      - name: Verify and unpack the preflight publisher runtime
        env:
          EXPECTED_SHA256: ${{ needs.preflight.outputs.publisher_runtime_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" release/promotion-bundle/publisher-runtime.tar.gz | sha256sum --check --status
          mkdir -p release/promotion-bundle/publisher-runtime
          tar -xzf release/promotion-bundle/publisher-runtime.tar.gz -C release/promotion-bundle/publisher-runtime

      - name: Publish the verified candidate with Trusted Publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          INPUT_VERSION: ${{ needs.preflight.outputs.version }}
          INPUT_AUTH_MODE: trusted-publishing
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          EXPECTED_RUN_ID: ${{ needs.preflight.outputs.run_id }}
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          PROMOTION_BUNDLE_DIR: release/promotion-bundle
        run: node --disable-warning=ExperimentalWarning release/promotion-bundle/publisher-runtime/scripts/release/publish-candidate.ts

  publish-pat:
    name: publish approved candidate with protected Open VSX PAT
    if: ${{ needs.preflight.result == 'success' && inputs.dry_run == false && needs.preflight.outputs.auth_mode == 'pat' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      url: https://open-vsx.org/extension/StefanSuess/cyclegauge
    permissions:
      contents: write
    steps:
      - name: Download the immutable promotion bundle from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-promotion-bundle
          path: release/promotion-bundle

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          token: ''

      - name: Verify and unpack the preflight publisher runtime
        env:
          EXPECTED_SHA256: ${{ needs.preflight.outputs.publisher_runtime_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" release/promotion-bundle/publisher-runtime.tar.gz | sha256sum --check --status
          mkdir -p release/promotion-bundle/publisher-runtime
          tar -xzf release/promotion-bundle/publisher-runtime.tar.gz -C release/promotion-bundle/publisher-runtime

      - name: Publish the verified candidate with protected PAT fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          OPENVSX_PAT: ${{ secrets.OPENVSX_PAT }}
          INPUT_VERSION: ${{ needs.preflight.outputs.version }}
          INPUT_AUTH_MODE: pat
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          EXPECTED_RUN_ID: ${{ needs.preflight.outputs.run_id }}
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          PROMOTION_BUNDLE_DIR: release/promotion-bundle
        run: node --disable-warning=ExperimentalWarning release/promotion-bundle/publisher-runtime/scripts/release/publish-candidate.ts
