# Synthetic cross-platform verification and one universal release candidate.
#
# Rules (security checkpoint SC3): normal jobs have a read-only token; only the main-only
# attestation job has signing rights. No secrets; third-party actions pinned by commit
# SHA, synthetic data only. Nothing here installs or runs Kiro and nothing publishes: the candidate is
# an artifact for separate native Kiro acceptance; publishing to Open VSX happens only through the manually
# dispatched, environment-approved release.yml workflow.
name: ci

on:
  push:
    branches: [main, 'claude/**', 'codex/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PNPM_VERSION: '12.10.1'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit suite
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: pnpm test
      - name: Unit suite with coverage
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          pnpm test:coverage | tee coverage.txt || coverage_status=$?
          {
            echo '### Synthetic unit-test coverage'
            echo 'Only source modules loaded by the unit suite are measured; this is not native Kiro coverage.'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${coverage_status:-0}"
      - name: Release tooling and packaging tests
        if: ${{ !cancelled() }}
        run: pnpm test:release
      # Platform-independent fixture bytes; the Windows runner's Python has no IANA timezone data.
      - name: Fixture contract validator
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: python3 tests/fixtures/kiro/validate.py

  # The candidate is built ONCE here. Host jobs verify that exact file by SHA-256 and the
  # build job rebuilds it independently to compare payload hashes (ZIP bytes and timestamps are not compared).
  candidate:
    name: release candidate (built once)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      vsix_name: ${{ steps.build.outputs.vsix_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build, verify, rebuild and compare
        id: build
        run: |
          export LC_ALL=C
          version="$(node -p "require('./package.json').version")"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'CANDIDATE_VERSION_INVALID'
            exit 1
          fi
          short="${GITHUB_SHA:0:12}"
          if ! [[ "$short" =~ ^[0-9a-f]{12}$ ]]; then
            echo 'CANDIDATE_COMMIT_INVALID'
            exit 1
          fi
          name="bobert-v${version}-${short}-candidate.vsix"
          mkdir release
          pnpm release:build "release/$name"
          pnpm release:verify "release/$name" --out release/manifest-linux.json
          pnpm release:build rebuild.vsix
          pnpm release:verify rebuild.vsix --compare release/manifest-linux.json
          sha="$(sha256sum "release/$name" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$name" >> "$GITHUB_OUTPUT"
          echo "$sha  $name" > release/SHA256SUMS.txt
          {
            echo '### Release candidate (built once, release channel derived from the version)'
            echo "File: $name"
            echo "SHA-256: $sha"
            echo '```'
            pnpm release:verify "release/$name"
            echo '```'
            echo 'Independent rebuild: payload hashes compared (job fails if different).'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release/
          retention-days: 90

  candidate-host:
    name: release candidate on ${{ matrix.platform }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: ubuntu-24.04
            platform: Ubuntu
          - os: windows-2025
            platform: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Validate the downloaded candidate file name and directory
        id: candidate
        shell: bash
        env:
          CANDIDATE_VSIX: ${{ needs.candidate.outputs.vsix_name }}
        run: |
          export LC_ALL=C
          if ! [[ "$CANDIDATE_VSIX" =~ ^bobert-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9a-f]{12}-candidate\.vsix$ ]] ||
             [[ "$CANDIDATE_VSIX" != *"-${GITHUB_SHA:0:12}-candidate.vsix" ]]; then
            echo 'CANDIDATE_NAME_INVALID'
            exit 1
          fi
          shopt -s dotglob nullglob
          entries=(release/*)
          if [ "${#entries[@]}" -ne 3 ]; then
            echo 'CANDIDATE_ARTIFACT_CONTENTS_INVALID'
            exit 1
          fi
          for entry in release/SHA256SUMS.txt release/manifest-linux.json "release/$CANDIDATE_VSIX"; do
            if [ ! -f "$entry" ] || [ -L "$entry" ]; then
              echo 'CANDIDATE_ARTIFACT_CONTENTS_INVALID'
              exit 1
            fi
          done
          echo "path=release/$CANDIDATE_VSIX" >> "$GITHUB_OUTPUT"
      - name: Content allowlist on the downloaded candidate
        shell: bash
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: node --disable-warning=ExperimentalWarning scripts/release/verify-vsix.ts "$CANDIDATE_PATH"
      - name: Verified candidate in a real VS Code extension host (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: pnpm test:host "$CANDIDATE_PATH"
      # Windows stays in the default PowerShell so Git Bash cannot rewrite TEMP/8.3 paths for the host test.
      - name: Verified candidate in a real VS Code extension host (Windows)
        if: runner.os == 'Windows'
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: pnpm test:host "$env:CANDIDATE_PATH"
      - name: Verified candidate in a real VS Code extension host (Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: xvfb-run -a pnpm test:host "$CANDIDATE_PATH"

  attest:
    name: attest release candidate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [verify, candidate, candidate-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release
      - name: Validate the downloaded candidate file name and directory
        id: candidate
        shell: bash
        env:
          CANDIDATE_VSIX: ${{ needs.candidate.outputs.vsix_name }}
        run: |
          export LC_ALL=C
          if ! [[ "$CANDIDATE_VSIX" =~ ^bobert-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9a-f]{12}-candidate\.vsix$ ]] ||
             [[ "$CANDIDATE_VSIX" != *"-${GITHUB_SHA:0:12}-candidate.vsix" ]]; then
            echo 'CANDIDATE_NAME_INVALID'
            exit 1
          fi
          shopt -s dotglob nullglob
          entries=(release/*)
          if [ "${#entries[@]}" -ne 3 ]; then
            echo 'CANDIDATE_ARTIFACT_CONTENTS_INVALID'
            exit 1
          fi
          for entry in release/SHA256SUMS.txt release/manifest-linux.json "release/$CANDIDATE_VSIX"; do
            if [ ! -f "$entry" ] || [ -L "$entry" ]; then
              echo 'CANDIDATE_ARTIFACT_CONTENTS_INVALID'
              exit 1
            fi
          done
          echo "path=release/$CANDIDATE_VSIX" >> "$GITHUB_OUTPUT"
      - name: Check the exact candidate SHA-256
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: printf '%s  %s\n' "$EXPECTED_CANDIDATE_SHA256" "$CANDIDATE_PATH" | sha256sum --check --status
      # The subject is the single name validated above (not a glob), taken from that step's output.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.candidate.outputs.path }}
