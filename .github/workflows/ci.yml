# Milestone 6, Task 0: cross-platform CI skeleton.
#
# Levels (docs/superpowers/plans/2026-10-10-milestone-6.md, section 1): every job here proves C2
# (the synthetic suite on that OS family) or collects C3 filesystem evidence. None of it is C4:
# nothing here installs or runs Kiro. Windows Server runners are not Windows 11; the UBI 9 container
# is RHEL 9 userland without SELinux. Jobs say so in their step summaries.
#
# Rules: read-only token, no secrets, third-party actions pinned by commit SHA, synthetic data only.
name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are evidence and are never cancelled by a later push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PNPM_VERSION: '12.10.1'
  # actions/checkout v4.2.2, actions/setup-node v4.4.0 (see uses: lines).

jobs:
  # macOS and Linux runners: the full suite must be green.
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-22.04]
        node: ['24.13.0', '24.x']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit suite (the 184 original baseline tests plus Milestone 6 additions)
        run: pnpm test
      - name: Milestone 6 proof-of-concept tests (pure SDDL, tool shim, survey script)
        if: ${{ !cancelled() }}
        run: pnpm test:poc
      - name: Fixture contract validator
        if: ${{ !cancelled() }}
        run: python3 tests/fixtures/kiro/validate.py
      - name: Packaging, content allowlist and bundle smoke tests
        if: ${{ !cancelled() }}
        run: pnpm test:release
      - name: Record runtime
        run: node -p "process.version + ' ' + process.platform + ' ' + process.arch"

  # Windows Server runners. Typecheck and the pure PoC tests must pass. The baseline suite is
  # EXPECTED to fail wherever a Store is opened, because the production win32 fail-closed
  # restriction is deliberately still in place; the failures are enumerated, not hidden.
  windows:
    name: windows (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        node: ['24.13.0']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Verify checkout kept LF line endings
        run: |
          if grep -rIq $'\r' tests/fixtures src tests/unit package.json; then echo 'CRLF found in checkout'; exit 1; fi
      - name: Milestone 6 proof-of-concept tests
        if: ${{ !cancelled() }}
        run: pnpm test:poc
      - name: Fixture contract validator
        if: ${{ !cancelled() }}
        run: |
          # Windows Python has no system timezone database; the validator needs the tzdata package.
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -m pip install --quiet tzdata
          "$PY" tests/fixtures/kiro/validate.py
      - name: Packaging, content allowlist and bundle smoke tests (storage refused state expected)
        if: ${{ !cancelled() }}
        run: pnpm test:release
      - name: Baseline suite (failures expected while win32 storage stays fail-closed)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          node --disable-warning=ExperimentalWarning --test --test-reporter=tap tests/unit/*.test.ts > baseline.tap 2>&1
          code=$?
          {
            echo "### Windows baseline suite on ${{ matrix.os }} (informational)"
            echo
            grep -E '^# (tests|pass|fail|skipped)' baseline.tap
            echo
            echo 'Failing top-level tests:'
            echo '```'
            grep -E '^not ok' baseline.tap | sort -u | head -n 400
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

  # Task 1A: collects Windows ACL evidence on real NTFS. Output is fixed codes and counts only.
  windows-acl-poc:
    name: windows ACL proof-of-concept (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Collect evidence (items 1-8)
        run: node --disable-warning=ExperimentalWarning scripts/poc/win-acl/poc.ts --markdown-file "$GITHUB_STEP_SUMMARY"

  # Workstream B: the same proof-of-concept under a Safer "Basic User" token (privileges removed from a
  # copy of the runner's own token). The report states the MEASURED integrity level; an elevated run is
  # never labelled non-elevated. Windows Server runner evidence, not Windows 11 client evidence.
  windows-acl-poc-nonelevated:
    name: windows ACL proof-of-concept, non-elevated attempt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Run under a reduced token and report the measured integrity level
        run: |
          node --disable-warning=ExperimentalWarning scripts/poc/win-acl/nonelevated.ts --markdown-file "$GITHUB_STEP_SUMMARY" | tee nonelevated.txt
          if ! grep -Eq '^NONELEVATED_RESULT=(obtained|already)$' nonelevated.txt; then
            echo '::warning::no non-elevated token was obtained on this runner; the report above is NOT non-elevated evidence'
          fi

  # R2: the suite as a non-root user on RHEL 9 userland, using the Node floor from the host.
  # Image pinned by digest (ubi9/ubi, multi-arch index). No SELinux, no Kiro: C2 only.
  ubi9:
    name: ubi9 container (non-root, node 24.13.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Suites inside the container
        run: |
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm --user 1001:1001 --network none \
            -v "$PWD":/work -v "$NODE_ROOT":/opt/node:ro \
            -e HOME=/tmp -e TMPDIR=/tmp -w /work \
            registry.access.redhat.com/ubi9/ubi@sha256:5858f9ace07316e3b12caab62f6c2481a5030bb6bafdca5a9ea324c321ef36df \
            /opt/node/bin/node --disable-warning=ExperimentalWarning --test tests/unit/*.test.ts tests/poc/*.test.ts
      - name: 'Survey script on RHEL 9 userland (not a RHEL host: no SELinux, no systemd)'
        run: |
          {
            echo '### rhel9-survey.sh inside ubi9 container (CI proxy, not evidence for a real host)'
            echo '```'
            docker run --rm --user 1001:1001 --network none -v "$PWD":/work:ro -e HOME=/tmp -w /work \
              registry.access.redhat.com/ubi9/ubi@sha256:5858f9ace07316e3b12caab62f6c2481a5030bb6bafdca5a9ea324c321ef36df \
              sh scripts/poc/rhel9-survey.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Task 9: the release candidate is built ONCE here. Every other OS verifies and smoke-tests this exact
  # file (identified by SHA-256) and separately rebuilds to compare payload hashes. Smoke tests run the
  # shipped bundle against a stub host: C2 evidence, not native Kiro verification.
  release-artifact:
    name: release candidate (built once)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build, verify and record the candidate
        id: build
        run: |
          mkdir release
          pnpm release:build release/candidate.vsix
          pnpm release:verify release/candidate.vsix --out release/manifest-linux.json
          echo "sha256=$(sha256sum release/candidate.vsix | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo '### Release candidate (built once)'
            echo "SHA-256: $(sha256sum release/candidate.vsix | cut -d' ' -f1)"
            echo '```'
            pnpm release:verify release/candidate.vsix
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: release/
          retention-days: 7

  release-verify:
    name: release candidate on ${{ matrix.os }}
    needs: release-artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: release
      - name: The downloaded file is the file that was built
        env:
          EXPECTED: ${{ needs.release-artifact.outputs.sha256 }}
        run: |
          actual="$(node -e "console.log(require('node:crypto').createHash('sha256').update(require('node:fs').readFileSync('release/candidate.vsix')).digest('hex'))")"
          echo "candidate sha256: $actual"
          [ -n "$EXPECTED" ] && [ "$actual" = "$EXPECTED" ]
      - name: Content allowlist on the downloaded candidate
        run: node --disable-warning=ExperimentalWarning scripts/release/verify-vsix.ts release/candidate.vsix
      - name: Bundle smoke tests on the downloaded candidate (stub host; storage refused on Windows)
        run: |
          for sim in none no-sqlite no-reviver no-watcher; do
            node --disable-warning=ExperimentalWarning scripts/release/smoke-bundle.ts release/candidate.vsix --simulate "$sim" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Reproducibility signal (local rebuild; payload hashes only)
        continue-on-error: true
        run: |
          npm install --global pnpm@${{ env.PNPM_VERSION }}
          pnpm install --frozen-lockfile
          pnpm release:build local.vsix
          node --disable-warning=ExperimentalWarning scripts/release/verify-vsix.ts local.vsix --compare release/manifest-linux.json | tee -a "$GITHUB_STEP_SUMMARY" \
            || { echo '::warning::local rebuild payload differs from the release candidate (investigate; ZIP bytes are not compared)'; exit 1; }
