# CI and release-candidate build for the macOS beta line.
#
# Rules (security checkpoint SC3): read-only token, no secrets, third-party actions pinned by commit
# SHA, synthetic data only. Nothing here installs or runs Kiro and nothing publishes: the candidate is
# an artifact for native macOS acceptance; publishing to Open VSX happens only through the manually
# dispatched, environment-approved release.yml workflow.
name: ci

on:
  push:
    branches: [main, 'claude/**', 'codex/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PNPM_VERSION: '12.10.1'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit suite
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Release tooling and packaging tests
        if: ${{ !cancelled() }}
        run: pnpm test:release
      - name: Fixture contract validator
        if: ${{ !cancelled() }}
        run: python3 tests/fixtures/kiro/validate.py

  # The candidate is built ONCE here. The macOS job below verifies that exact file by SHA-256 and the
  # build job rebuilds it independently to compare payload hashes (ZIP bytes and timestamps are not compared).
  candidate:
    name: release candidate (built once)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build, verify, rebuild and compare
        id: build
        run: |
          mkdir release
          pnpm release:build release/candidate.vsix --pre-release
          pnpm release:verify release/candidate.vsix --pre-release --out release/manifest-linux.json
          pnpm release:build rebuild.vsix --pre-release
          pnpm release:verify rebuild.vsix --pre-release --compare release/manifest-linux.json
          sha="$(sha256sum release/candidate.vsix | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  candidate.vsix" > release/SHA256SUMS.txt
          {
            echo '### Release candidate (built once, pre-release flag set)'
            echo "SHA-256: $sha"
            echo '```'
            pnpm release:verify release/candidate.vsix --pre-release
            echo '```'
            echo 'Independent rebuild: payload hashes compared (job fails if different).'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: release/
          retention-days: 90

  candidate-macos:
    name: release candidate on macOS
    needs: candidate
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: release
      - name: The downloaded file is the file that was built
        env:
          EXPECTED: ${{ needs.candidate.outputs.sha256 }}
        run: |
          actual="$(shasum -a 256 release/candidate.vsix | cut -d' ' -f1)"
          echo "candidate sha256: $actual"
          [ -n "$EXPECTED" ] && [ "$actual" = "$EXPECTED" ]
      - name: Content allowlist on the downloaded candidate
        run: node --disable-warning=ExperimentalWarning scripts/release/verify-vsix.ts release/candidate.vsix --pre-release
