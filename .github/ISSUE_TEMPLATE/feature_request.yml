name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/StefanSuess/Bobert/blob/HEAD/ROADMAP.md) first. Features that read more Kiro data or touch
        privacy-sensitive areas need explicit maintainer approval. Never include real Kiro data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour
