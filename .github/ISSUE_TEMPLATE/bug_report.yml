name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real Kiro logs, databases, tokens, account/session identifiers, prompts or private paths.**
        Diagnostics output (fixed codes and counts only) is safe to paste.
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: kiro
    attributes:
      label: Kiro version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Ubuntu / Debian, RHEL / Fedora, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output (optional, only if your version has it)
      description: Run "Bobert: Report a Problem" (or "Bobert: Copy Diagnostics") in the editor, or `--diagnostics` on the command line (fixed codes and counts only). Review it before pasting.
      render: text
